# Alembic configuration for the schema migrations this architecture's pgvector
# note requires (enabling the `vector` extension "once in a migration", rather
# than assumed present). See backend/alembic/env.py for how DATABASE_URL is read.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Overridden at runtime from DATABASE_URL by env.py; the placeholder below is
# only ever used by `alembic` commands that skip env.py entirely, which this
# project's env.py does not allow to happen silently.
sqlalchemy.url = postgresql+psycopg://app:app@localhost:5432/app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
